<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Register')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container narrow">
    <h1>Create account</h1>
    <p class="muted">Create an account to save your ideas and guided plans.</p>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="form-card" novalidate>
        <label for="username">Username</label>
        <input id="username"
               type="text"
               th:field="*{username}"
               th:classappend="${#fields.hasErrors('username')} ? 'input-error'"
               required
               minlength="3"
               maxlength="24"
               autocomplete="username">
        <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        <p class="hint">3–24 characters. Start with a letter. Letters, numbers, and underscores only.</p>

        <label for="email">Email</label>
        <input id="email"
               type="email"
               th:field="*{email}"
               th:classappend="${#fields.hasErrors('email')} ? 'input-error'"
               required
               maxlength="255"
               autocomplete="email">
        <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="password">Password</label>
        <input id="password"
               type="password"
               th:field="*{password}"
               th:classappend="${#fields.hasErrors('password')} ? 'input-error'"
               required
               minlength="8"
               maxlength="100"
               autocomplete="new-password">
        <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        <p class="hint">At least 8 characters</p>

        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword"
               type="password"
               th:field="*{confirmPassword}"
               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'input-error'"
               required
               maxlength="100"
               autocomplete="new-password">
        <p class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

        <div class="actions">
            <button class="button" type="submit">Register</button>
            <a class="button secondary" th:href="@{/login}">Back to login</a>
        </div>
    </form>
</main>
</body>
</html>
