<header class="site-header" th:fragment="header" xmlns:th="http://www.thymeleaf.org">
    <div class="container header-inner">
        <a class="brand" th:href="@{/}">
            <img class="brand-logo" th:src="@{/images/ideaspec-logo.png}" alt="" width="36" height="36">
            <span class="brand-name">IdeaSpec</span>
        </a>
        <nav class="header-nav">
            <th:block th:if="${currentUserEmail != null}">
                <a th:href="@{/projects}">Projects</a>
                <a th:href="@{/projects/new}">New project</a>
                <a th:href="@{/settings/llm}">AI helpers</a>
                <a th:href="@{/profile}">Profile</a>
                <a th:if="${currentUserAdmin}" th:href="@{/admin}">Admin</a>
                <span class="nav-user" th:text="${currentUserEmail}">user@example.com</span>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit" class="link-button">Log out</button>
                </form>
            </th:block>
            <th:block th:if="${currentUserEmail == null}">
                <a th:href="@{/login}">Log in</a>
                <a class="button header-cta" th:href="@{/register}">Register</a>
            </th:block>
        </nav>
    </div>
</header>
