<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Projects')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container">
    <div th:if="${message}" class="flash" th:text="${message}"></div>
    <div th:if="${errorMessage}" class="flash error-flash" th:text="${errorMessage}"></div>
    <div th:if="${!hasConfiguredProvider}" class="flash error-flash">
        You need an AI helper API key before starting a project.
        <a th:href="@{/settings/llm}">Open AI helpers to add one</a>.
    </div>

    <section class="project-header">
        <h1>Your projects</h1>
        <div class="actions">
            <a class="button" th:href="@{/projects/new}">Start new project</a>
            <a class="button secondary" th:if="${!hasConfiguredProvider}" th:href="@{/settings/llm}">Add API key</a>
        </div>
    </section>

    <div th:if="${#lists.isEmpty(projects)}" class="empty-state">
        <p>No projects yet. Start with a short idea in everyday words.</p>
        <div class="actions" style="justify-content:center">
            <a class="button" th:href="@{/projects/new}">Start new project</a>
        </div>
    </div>
    <div class="card-grid" th:if="${!#lists.isEmpty(projects)}">
        <article class="card" th:each="project : ${projects}">
            <h3>
                <a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.title}">Title</a>
            </h3>
            <p class="muted" th:text="${#strings.abbreviate(project.initialIdea, 120)}">Idea</p>
            <div class="meta">
                <span class="badge" th:text="${@taxonomyLabels.status(project.status.name())}">In progress</span>
                <span th:text="${project.updatedAtLabel}">date</span>
            </div>
        </article>
    </div>
</main>
</body>
</html>
